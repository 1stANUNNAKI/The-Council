/* ================= RENDER ================= */
let cur='en',busy=false,done=new Set(),autoPlayed=false;
const t=()=>L[cur];
function $(id){return document.getElementById(id)}
function render(){
 const d=t();document.body.dir=d.dir;document.documentElement.lang=cur;
 $('langBtn').textContent=d.btn;$('ttl').textContent=d.ttl;$('hint').textContent=d.hint;
 $('h1').innerHTML=d.h1;$('tag').innerHTML=d.tag;
 $('cta1').textContent=d.cta1;$('fin_h').innerHTML=d.fin_h;$('fin_p').textContent=d.fin_p;$('fin_c1').textContent=d.fin_c1;
 document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t()[el.dataset.i]);
 $('featGrid').innerHTML=t().features.map(f=>`<div class="fcard"><div class="e">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('');
 $('cmpRows').innerHTML=t().cmp.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
 $('pipeRow').innerHTML=t().pipe.map(p=>`<div class="ph p${p[0].match(/\d/)[0]}"><h4>${p[0]} ${p[1]}</h4>${p.slice(2).map(s=>`<span class="st">${s}</span>`).join('')}</div>`).join('');
 renderCouncil();renderFAQ();renderChips();
}
function renderCouncil(f='all'){
 const d=t();
 $('filters').innerHTML=`<button class="fb ${f==='all'?'on':''}" onclick="renderCouncil('all')">${cur==='en'?'All 40':'الكل'}</button>`+
  Object.entries(TEAMS).map(([k,v])=>`<button class="fb ${f===k?'on':''}" onclick="renderCouncil('${k}')">${cur==='en'?v[0]:v[1]}</button>`).join('');
 $('cgrid').innerHTML=AG.filter(a=>f==='all'||a[5]===f).map(a=>`<div class="ccard"><div class="e">${a[0]}</div><h4>${a[2]}</h4><div class="id">@${a[1]}</div><p>${cur==='en'?a[3]:a[4]}</p></div>`).join('');
}
function renderFAQ(){
 $('faqBox').innerHTML=t().faqs.map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
}
function renderChips(){
 const d=t();
 $('chips').innerHTML=['start','plan','build','sec'].map(k=>
  `<button class="chip ${done.has(k)?'done':''}" id="chip_${k}" onclick="play('${k}')">${done.has(k)?'✓ ':''}${esc(d.cmds[k])}</button>`).join('')+
  `<button class="chip" onclick="resetTerm()">${d.reset}</button>`;
}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function line(html){const dv=document.createElement('div');dv.innerHTML=html;$('tbody').appendChild(dv);return dv}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function typeCmd(text){
 const dv=line(`<span class="d">$ </span><span class="cmdTxt"></span><span class="caret"></span>`);
 const span=dv.querySelector('.cmdTxt');
 for(const ch of text){span.textContent+=ch;await sleep(28)}
 await sleep(200);dv.querySelector('.caret').remove();
}
async function play(k){
 if(busy)return;busy=true;renderChips();
 const d=t();
 line('&nbsp;');
 await typeCmd(d.cmds[k]);
 for(const st of SC[cur][k]){await sleep(st.d||350);line(st.o);}
 done.add(k);busy=false;renderChips();
 const nb=['start','plan','build','sec'].find(x=>!done.has(x));
 if(nb&&!autoPlayed){}
}
async function autoplay(){
 if(autoPlayed)return;autoPlayed=true;
 await sleep(1200);
 if(!busy&&!done.size)await play('start');
}
function resetTerm(){
 if(busy)return;done.clear();$('tbody').innerHTML='';renderChips();
 line(`<span class="d">$ _</span><span class="caret"></span>`);
 setTimeout(()=>{const c=document.querySelector('.tbody .caret');if(c)c.remove()},1500);
}
